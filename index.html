<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සස්විරු GPT - AI සහායකයා</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #212121;
            --sidebar-bg: #171717;
            --chat-bg: #212121;
            --text-color: #ececec;
            --border-color: #2f2f2f;
            --input-bg: #2f2f2f;
            --accent-color: #10a37f;
            --hover-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .sidebar-header {
            padding: 12px;
        }

        .new-chat-btn {
            width: 100%;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: var(--hover-color);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .history-item {
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #b4b4b4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .history-item:hover {
            background-color: var(--hover-color);
            color: var(--text-color);
        }

        /* Main Chat Area */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        .chat-header {
            padding: 15px 20px;
            font-size: 18px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 120px;
        }

        .message {
            display: flex;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            line-height: 1.6;
            font-size: 15px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.user .message-content {
            background-color: #2f2f2f;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 70%;
            word-break: break-word;
        }

        .message.ai .avatar {
            width: 32px;
            height: 32px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }

        .message.ai .message-content {
            flex: 1;
            padding-top: 4px;
            word-break: break-word;
            white-space: pre-wrap;
        }

        /* Input Area */
        .input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, var(--bg-color) 50%);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .input-box {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 15px;
            resize: none;
            max-height: 200px;
            outline: none;
            padding: 8px;
            line-height: 1.4;
        }

        .send-btn {
            background-color: var(--accent-color);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        /* Welcome Screen */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 15px;
        }

        .welcome-screen h1 {
            font-size: 28px;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: -260px;
                height: 100%;
            }
            .sidebar.active {
                left: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fa-solid fa-plus"></i> නව සංවාදයක් (New Chat)
            </button>
        </div>
        <div class="chat-history" id="chatHistory">
            <div class="history-item">සස්විරු GPT හැඳින්වීම</div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <div class="chat-header">
            <span style="cursor:pointer;" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></span>
            <span>සස්විරු GPT</span>
            <i class="fa-solid fa-user-circle" style="font-size: 20px;"></i>
        </div>

        <!-- Chat Messages Container -->
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-screen" id="welcomeScreen">
                <h1>මම සස්විරු GPT!</h1>
                <p>අද මගෙන් ඔබට උදව් කළ හැක්කේ කුමක් ද?</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" rows="1" placeholder="සස්විරු GPT වෙත පණිවිඩයක් ලියන්න..." oninput="autoResize(this)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
        </div>
    </div>

    <script>
        // ඔබ ලබා දුන් OpenAI API Key එක මෙහි ඇතුළත් කර ඇත
        const API_KEY = "Sk-proj-U1W4Ac7FqZ7PFZUT2RTwB1JJjGneyBb9kyGmK4M2hmvasZd22xY3Bl3WxGkUX-CFojEL66uBTJT3BlbkFJHp-Y_AhnW_rmq-NhJMUVWelkLFh1RM-EVXDoRaUECHU-pdGDQbmrPgMTFQt-LzzsKrJEHwy-EA".trim();
        
        let conversationHistory = [];

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function startNewChat() {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = `
                <div class="welcome-screen" id="welcomeScreen">
                    <h1>මම සස්විරු GPT!</h1>
                    <p>අද මගෙන් ඔබට උදව් කළ හැක්කේ කුමක් ද?</p>
                </div>
            `;
            conversationHistory = [];
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const messageText = input.value.trim();
            if (!messageText) return;

            const welcomeScreen = document.getElementById('welcomeScreen');
            if (welcomeScreen) {
                welcomeScreen.remove();
            }

            const chatMessages = document.getElementById('chatMessages');

            // User Message Display
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user';
            userMsgDiv.innerHTML = `<div class="message-content">${escapeHtml(messageText)}</div>`;
            chatMessages.appendChild(userMsgDiv);

            input.value = '';
            input.style.height = 'auto';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Add user message to history
            conversationHistory.push({ role: "user", content: messageText });

            // AI Loading Placeholder
            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai';
            aiMsgDiv.innerHTML = `
                <div class="avatar">ස</div>
                <div class="message-content" id="loadingText">සස්විරු GPT සිතමින් පවතී...</div>
            `;
            chatMessages.appendChild(aiMsgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo",
                        messages: conversationHistory,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                const contentDiv = aiMsgDiv.querySelector('.message-content');

                if (data.choices && data.choices.length > 0) {
                    const aiReply = data.choices[0].message.content;
                    contentDiv.textContent = aiReply;
                    conversationHistory.push({ role: "assistant", content: aiReply });
                } else if (data.error) {
                    contentDiv.textContent = "දෝෂයක් සිදු විය: " + data.error.message;
                } else {
                    contentDiv.textContent = "සමාවන්න, පිළිතුරක් ලබා ගැනීමට නොහැකි විය.";
                }
            } catch (error) {
                const contentDiv = aiMsgDiv.querySelector('.message-content');
                contentDiv.textContent = "ජාල දෝෂයක් (Network Error) සිදු විය. කරුණාකර නැවත උත්සාහ කරන්න.";
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Enter key to send message
        document.getElementById('userInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
